name: caddy-gateway

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy-gateway:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caddy-gateway
    network_mode: host
    restart: unless-stopped
    init: true
    environment:
      TLS_CERT: ${TLS_CERT:?TLS_CERT must be a path below /certs}
      TLS_KEY: ${TLS_KEY:?TLS_KEY must be a path below /certs}
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_CERTS_DIR:?TLS_CERTS_DIR must point to the certificate directory}
        target: /certs
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: caddy_data
        target: /data
      - type: volume
        source: caddy_config
        target: /config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=/dev/null
        - http://127.0.0.1:2019/config/
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
